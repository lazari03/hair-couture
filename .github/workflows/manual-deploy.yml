name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: manual-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Hetzner
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RAW_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          DEPLOY_PORT_CLEAN="$(printf '%s' "$RAW_DEPLOY_PORT" | tr -d '[:space:]')"
          if [[ "$DEPLOY_PORT_CLEAN" =~ ^[0-9]+$ ]]; then
            DEPLOY_PORT_SAFE="$DEPLOY_PORT_CLEAN"
          else
            DEPLOY_PORT_SAFE="22"
          fi
          echo "DEPLOY_PORT_SAFE=$DEPLOY_PORT_SAFE" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          # Normalize CRLF and avoid adding an extra newline that can corrupt key parsing.
          printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is not a valid private key."
            echo "Paste the full private key (BEGIN/END lines included) into the GitHub secret."
            exit 1
          fi

          ssh-keyscan -p "$DEPLOY_PORT_SAFE" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT_SAFE" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch origin && git checkout '$DEPLOY_REF' && git reset --hard \"origin/$DEPLOY_REF\" && docker compose up -d --build"