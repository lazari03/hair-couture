services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - sqlite-data:/data
    # No host port mapping — Caddy reaches the app over the internal Docker
    # network (reverse_proxy app:3000 in the Caddyfile) regardless. Publishing
    # 3000 on the host would let anyone bypass Caddy's TLS entirely.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  sqlite-data:
  caddy-data:
  caddy-config:
